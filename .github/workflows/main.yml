name: generate pacman game

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install pacman-contribution-graph
        run: npm install -g pacman-contribution-graph

      # 👇 GERA TEMA CLARO
      - name: generate light svg
        run: |
          pacman-contribution-graph \
          --username ${{ github.repository_owner }} \
          --output dist/pacman-contribution-graph.svg

      # 👇 GERA TEMA ESCURO
      - name: generate dark svg
        run: |
          pacman-contribution-graph \
          --username ${{ github.repository_owner }} \
          --gameTheme github-dark \
          --output dist/pacman-contribution-graph-dark.svg

      # 🚀 Push dos arquivos
      - name: push pacman files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
